# Render Blueprint for the Mwalimu stack (monorepo)
#
# Each app is an independent root directory; Render builds each from a Dockerfile
# via runtime: docker. dockerfilePath is REPO-relative; dockerContext is the
# service dir so the COPY paths in each Dockerfile resolve.
#
# NO variable interpolation is supported, so cross-service URLs use
# fromService.envVarKey: RENDER_EXTERNAL_URL (Render's injected public URL).
#
# The 3 shared secrets must be identical on platform-api and agent-service —
# they are `sync: false` so Render prompts at creation; enter the SAME value per pair.
services:
  # ---- System of record + orchestration (Django) -------------------------
  - type: web
    name: mwalimu-platform-api
    runtime: docker
    rootDir: platform_api
    dockerContext: platform_api
    dockerfilePath: platform_api/Dockerfile
    plan: starter
    healthCheckPath: /
    dockerCommand: >-
      sh -c ".venv/bin/python manage.py migrate --noinput &&
             .venv/bin/python manage.py collectstatic --noinput &&
             .venv/bin/gunicorn platform_api.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: platform_api.settings
      - key: PYTHONPATH
        value: /app/src
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://mwalimu-platform-api.onrender.com,https://mwalimu-frontend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://mwalimu-frontend.onrender.com"
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mwalimu-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: mwalimu-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: mwalimu-redis
          property: connectionString
      - key: AGENT_SERVICE_BASE_URL
        fromService:
          type: web
          name: mwalimu-agent-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: AGENT_SERVICE_PUBLIC_BASE_URL
        fromService:
          type: web
          name: mwalimu-agent-service
          envVarKey: RENDER_EXTERNAL_URL
      # Shared secrets — set the SAME value on both platform-api and agent-service
      - key: AGENT_SERVICE_JWT_SECRET_KEY
        sync: false
      - key: INTERNAL_SERVICE_SECRET_KEY
        sync: false
      - key: AGENT_STREAM_JWT_SECRET_KEY
        sync: false
      # Object storage (S3-compatible) — set in dashboard
      - key: OBJECT_STORAGE_BACKEND
        value: platform_api.apps.resources.storage.S3Storage
      - key: OBJECT_STORAGE_ENDPOINT
        value: ""
      - key: OBJECT_STORAGE_REGION
        value: ""
      - key: OBJECT_STORAGE_ACCESS_KEY
        value: ""
      - key: OBJECT_STORAGE_SECRET_KEY
        value: ""
      - key: OBJECT_STORAGE_BUCKET
        value: mwalimu
      # Embeddings (DeepSeek has no embeddings API — use OpenAI/compatible)
      - key: EMBEDDING_PROVIDER_BACKEND
        value: platform_api.apps.processing.embedding.openai_provider.OpenAICompatibleProvider
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"

  # ---- Celery worker (same image, background command) --------------------
  - type: worker
    name: mwalimu-celery-worker
    runtime: docker
    rootDir: platform_api
    dockerContext: platform_api
    dockerfilePath: platform_api/Dockerfile
    plan: starter
    dockerCommand: >-
      sh -c ".venv/bin/celery -A platform_api worker -Q default,ingestion -l info"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: platform_api.settings
      - key: PYTHONPATH
        value: /app/src
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mwalimu-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: mwalimu-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: mwalimu-redis
          property: connectionString
      - key: OBJECT_STORAGE_BACKEND
        value: platform_api.apps.resources.storage.S3Storage
      - key: OBJECT_STORAGE_ENDPOINT
        value: ""
      - key: OBJECT_STORAGE_REGION
        value: ""
      - key: OBJECT_STORAGE_ACCESS_KEY
        value: ""
      - key: OBJECT_STORAGE_SECRET_KEY
        value: ""
      - key: OBJECT_STORAGE_BUCKET
        value: mwalimu
      - key: EMBEDDING_PROVIDER_BACKEND
        value: platform_api.apps.processing.embedding.openai_provider.OpenAICompatibleProvider
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"

  # ---- Agent Service (FastAPI) -------------------------------------------
  - type: web
    name: mwalimu-agent-service
    runtime: docker
    rootDir: agent_service
    dockerContext: agent_service
    dockerfilePath: agent_service/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_MODEL_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_DEFAULT_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: PLATFORM_API_BASE_URL
        fromService:
          type: web
          name: mwalimu-platform-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: PLATFORM_COMPLETION_URL
        fromService:
          type: web
          name: mwalimu-platform-api
          envVarKey: RENDER_EXTERNAL_URL
      # Must match platform-api (same value)
      - key: JWT_SECRET_KEY
        sync: false
      - key: INTERNAL_SERVICE_SECRET_KEY
        sync: false
      - key: AGENT_STREAM_JWT_SECRET_KEY
        sync: false

  # ---- Frontend (Next.js) ------------------------------------------------
  - type: web
    name: mwalimu-frontend
    runtime: docker
    rootDir: frontend
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      # Inlined at build time (NEXT_PUBLIC_); Render injects the referenced URL into the build env.
      - key: NEXT_PUBLIC_PLATFORM_API_BASE_URL
        fromService:
          type: web
          name: mwalimu-platform-api
          envVarKey: RENDER_EXTERNAL_URL

  # ---- Data --------------------------------------------------------------
  - type: postgres
    name: mwalimu-postgres
    databaseName: mwalimu
    plan: basic-256mb

  - type: keyvalue
    name: mwalimu-redis
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    plan: starter
