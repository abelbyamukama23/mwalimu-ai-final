name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  platform:
    name: Platform API (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform_api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mwalimu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mwalimu
      DJANGO_SETTINGS_MODULE: platform_api.settings
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check src
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest -q

  agent:
    name: Agent Service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check src
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_PLATFORM_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build platform image
        run: docker build -t mwalimu-platform -f platform_api/Dockerfile platform_api
      - name: Build agent image
        run: docker build -t mwalimu-agent -f agent_service/Dockerfile agent_service
      - name: Build frontend image
        run: docker build -t mwalimu-frontend -f frontend/Dockerfile frontend
