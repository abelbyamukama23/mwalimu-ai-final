[project]
name = "mwalimu-agent-service"
version = "0.1.0"
description = "Mwalimu Agent Service — FastAPI agent runtime"
requires-python = "==3.13.*"
license = { text = "Proprietary" }
authors = [
    { name = "Mwalimu Team" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Web framework / server
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",

    # Validation and settings
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.8,<3.0",

    # Agent runtime
    "openai-agents>=0.4,<0.5",
    "openai>=2.2,<3.0",

    # HTTP client for internal Platform API calls
    "httpx>=0.28,<0.29",

    # MCP protocol
    "mcp>=1.10,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.26,<0.27",
    "ruff>=0.11,<0.12",
    "mypy>=1.15,<2.0",
]

[project.urls]
Homepage = "https://github.com/mwalimu/agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src"]
show_error_codes = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = false
