[project]
name = "mwalimu-platform-api"
version = "0.1.0"
description = "Mwalimu Platform API — Django system of record"
requires-python = "==3.13.*"
license = { text = "Proprietary" }
authors = [
    { name = "Mwalimu Team" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Web framework
    "django>=6.0,<6.1",
    "djangorestframework>=3.16,<4.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "drf-spectacular>=0.28,<0.29",
    "django-cors-headers>=4.7,<5.0",
    "django-environ>=0.12,<1.0",
    # PostgreSQL / pgvector
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3,<0.4",
    # Asynchronous processing
    "celery[redis]>=5.5,<6.0",
    "redis>=5.3,<6.0",
    # Validation, settings, and HTTP clients
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.8,<3.0",
    "httpx>=0.28,<0.29",
    # Static files and WSGI server
    "whitenoise>=6.9,<7.0",
    "gunicorn>=23.0,<24.0",
    # Object storage
    "boto3>=1.37,<2.0",
    # Document extraction
    "pypdf>=5.0,<6.0",
    "python-docx>=1.1,<2.0",
    "cryptography>=44.0,<45.0",
    "jsonschema>=4.23,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.11,<5.0",
    "ruff>=0.11,<0.12",
    "mypy>=1.15,<2.0",
    "django-stubs>=5.1,<6.0",
    "djangorestframework-stubs>=3.16,<4.0",
    "types-psycopg2>=2.9,<3.0",
]

[project.urls]
Homepage = "https://github.com/mwalimu/platform"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_api"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "platform_api.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q --reuse-db"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]
exclude = [
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
mypy_path = ["src"]
show_error_codes = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "boto3.*",
    "botocore.*",
    "celery.*",
    "pypdf.*",
    "docx.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "platform_api.settings"

[dependency-groups]
dev = [
    "types-jsonschema>=4.26.0.20260518",
]
